# Roda o plano de testes em uma maquina limpa do GitHub a cada envio de codigo.
# Se algum cenario falhar, o envio fica marcado com um X vermelho.
name: Testes

on:
  push:                     # a cada envio, em qualquer ramo
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: read            # o fluxo so precisa ler o repositorio

jobs:
  verificacao:
    name: Plano de testes
    runs-on: ubuntu-24.04     # versao fixa, para o resultado nao mudar quando o GitHub trocar a padrao
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7

      - name: Instalar o Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependencias
        run: pip install -r requirements.txt

      - name: Executar o plano de testes
        run: python src/verificacao.py
